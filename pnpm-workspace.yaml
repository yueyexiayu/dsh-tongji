# The project is its own pnpm workspace root, so pnpm never walks up into a
# parent workspace (e.g. $HOME) when installing.
packages:
  - .

# Allow esbuild's postinstall (binary bootstrap); everything else is pure JS.
allowBuilds:
  esbuild: true

# One zod copy at or above the 4.6.6 security floor (GHSA-mrhx-c7xc-m3w5); the
# dsh dev packages still range ^4.4.3 and would otherwise keep a second copy.
overrides:
  zod: ^4.6.6

# These are the exact versions this plugin builds against; each one is pinned in
# package.json, so the release-age gate is waived for them alone. Anything else
# keeps the default gate.
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-client-store@0.2.2-rc.5'
  - '@deepseek-ai/dsh-client-ui-primitives@0.2.2-rc.5'
  - '@deepseek-ai/dsh-error@0.2.2-rc.5'
  - '@deepseek-ai/dsh-scope@0.2.2-rc.5'
  - '@deepseek-ai/dsh-session@0.2.2-rc.5'
  - '@deepseek-ai/dsh-session-projection@0.2.2-rc.5'
  - '@deepseek-ai/dsh-util-code-language@0.2.2-rc.5'
  - '@deepseek-ai/dsh-util-workspace-path@0.2.2-rc.5'
  - '@deepseek-ai/cosmokit@1.9.0'
  - '@deepseek-ai/schemastery@3.19.0'
  - '@deepseek-ai/cordis@4.1.0'
