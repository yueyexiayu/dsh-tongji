<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc">
  <title id="title">tongji 数据流程</title>
  <desc id="desc">当前会话通过官方统计快照和会话投影流向右侧统计卡。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0f766e"/></marker></defs>
  <rect width="1120" height="250" rx="18" fill="#f0fdfa"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle">
    <rect x="44" y="72" width="220" height="106" rx="14" fill="#134e4a"/><text x="154" y="116" fill="#fff" font-size="19" font-weight="700">当前 Session</text><text x="154" y="145" fill="#99f6e4" font-size="14">切换时重新绑定</text>
    <rect x="342" y="72" width="220" height="106" rx="14" fill="#ccfbf1" stroke="#5eead4" stroke-width="2"/><text x="452" y="112" fill="#115e59" font-size="17" font-weight="700">官方统计快照</text><text x="452" y="140" fill="#0f766e" font-size="14">轮次 · 步骤 · 摘要</text>
    <rect x="640" y="72" width="220" height="106" rx="14" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/><text x="750" y="112" fill="#5b21b6" font-size="17" font-weight="700">会话投影</text><text x="750" y="140" fill="#6d28d9" font-size="14">sessionStats · tokenUsage</text>
    <rect x="938" y="72" width="138" height="106" rx="14" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/><text x="1007" y="112" fill="#92400e" font-size="17" font-weight="700">右侧卡</text><text x="1007" y="140" fill="#a16207" font-size="14">统计</text>
    <path d="M264 125H334M562 125H632M860 125H930" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
